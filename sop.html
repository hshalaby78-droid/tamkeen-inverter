<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دليل معايير التشغيل القياسية – تجزئة تمكين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#283582;--navy2:#1d2766;--ink:#1c2233;--mut:#5d6578;--line:#e3e6ef;--bg:#f5f6fa;--card:#fff;--soft:#eef0f8;--mod:#b45309;--modbg:#fff4e0;--new:#0f7a4a;--newbg:#e3f6ec;--red:#b42318;--redbg:#fdecea}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.75}
button,select,input{font-family:inherit;font-size:inherit}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hrow{display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.hrow img{height:42px}
.htitle{flex:1;min-width:200px}
.htitle h1{margin:0;font-size:18px;color:var(--navy);font-weight:700}
.htitle .ver{font-size:12.5px;color:var(--mut)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools input{border:1px solid var(--line);border-radius:8px;padding:6px 12px;width:220px;background:var(--bg)}
.tools select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;background:#fff;cursor:pointer;user-select:none}
.chip input{margin:0}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 14px;scrollbar-width:thin}
nav.tabs button{border:0;background:none;padding:10px 14px;white-space:nowrap;color:var(--mut);border-bottom:3px solid transparent;cursor:pointer;font-weight:500}
nav.tabs button.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:700}
nav.tabs button .n{font-size:11px;background:var(--soft);color:var(--navy);border-radius:999px;padding:0 7px;margin-inline-start:6px}
nav.tabs button{display:inline-flex;align-items:center;gap:7px}.chi{flex:none;vertical-align:middle}.chl{display:flex;align-items:center;gap:6px}nav.tabs button:not(.on) .chi{opacity:.75}
nav.tabs button.aud{color:var(--red)}
nav.tabs button.aud.on{border-bottom-color:var(--red)}
main{display:grid;grid-template-columns:320px 1fr;gap:18px;padding:18px 20px;max-width:1400px;margin:0 auto}
aside{position:sticky;top:120px;align-self:start;max-height:calc(100vh - 140px);overflow:auto}
.list{display:flex;flex-direction:column;gap:6px}
.item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;text-align:right}
.item:hover{border-color:#c5cae0}
.item.on{border-color:var(--navy);box-shadow:inset -4px 0 0 var(--navy)}
.item .c{font-size:11.5px;color:var(--mut);font-family:ui-monospace,Consolas,monospace;direction:ltr;display:inline-block}
.item .t{font-weight:600;font-size:14px}
.badge{font-size:11px;border-radius:6px;padding:1px 7px;font-weight:600;margin-inline-start:6px;vertical-align:middle}
.b-new{background:var(--newbg);color:var(--new)}
.b-mod{background:var(--modbg);color:var(--mod)}
.sop{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 26px;min-width:0}
.sop h2{margin:2px 0 4px;font-size:22px;color:var(--navy)}
.code{font-family:ui-monospace,Consolas,monospace;direction:ltr;display:inline-block;color:var(--mut);font-size:13px;white-space:nowrap}
.raci{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 6px}
.raci div{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:13.5px}
.raci b{display:block;font-size:11.5px;color:var(--navy);font-weight:700}
h3{font-size:15.5px;color:var(--navy);margin:20px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
ol.pol{margin:0;padding-inline-start:22px}
ol.pol li{margin:5px 0}
.tag{font-size:10.5px;border-radius:5px;padding:0 6px;margin-inline-start:6px;font-weight:700;white-space:nowrap}
.t-new{background:var(--newbg);color:var(--new)}
.t-mod{background:var(--modbg);color:var(--mod)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:right;vertical-align:top}
th{background:var(--soft);color:var(--navy);font-weight:600;font-size:13px}
td.num{width:38px;text-align:center;color:var(--mut)}
td.role{width:190px;font-weight:600;color:#33406f}
td.form{width:150px;color:var(--mut);font-size:12.5px}
.tw{overflow-x:auto}
.grp{font-weight:700;margin:12px 0 6px;color:#33406f}
.kv{display:flex;flex-wrap:wrap;gap:6px}
.kv span{background:var(--soft);border-radius:8px;padding:3px 10px;font-size:13px}
ul.k{margin:0;padding-inline-start:20px}
.notes{background:#fffaf2;border:1px solid #f3dfb8;border-radius:12px;padding:12px 16px;margin-top:20px}
.notes h3{border:0;margin-top:0;color:var(--mod)}
.notes li{margin:4px 0}
.muted{color:var(--mut)}
.audit{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 26px;grid-column:1/-1}
.audit h2{color:var(--navy);margin-top:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 16px}
.stat{background:var(--soft);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:26px;color:var(--navy);line-height:1.2}
.stat span{font-size:13px;color:var(--mut)}
.sev{color:var(--red);font-weight:700}
.empty{padding:40px;text-align:center;color:var(--mut)}
.back{display:none}
.portal-note{font-size:12px;color:var(--mut)}
@media (max-width:900px){
 header{position:static}
 main{grid-template-columns:1fr;padding:12px}
 .hrow{padding:8px 12px;gap:8px}
 .hrow img{height:32px}
 .htitle h1{font-size:16px}
 aside{position:static;max-height:none}
 body.detail aside{display:none}
 body:not(.detail) .sop{display:none}
 .back{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 12px;margin-bottom:10px;cursor:pointer}
 .raci{grid-template-columns:1fr 1fr}
 .stats{grid-template-columns:1fr 1fr}
 .sop,.audit{padding:16px}
 .tools input{width:100%}
 .tools{width:100%}
 td.role{width:auto}
 td.form{display:none}
 th.form{display:none}
}
@media print{
 header nav,.tools,aside,.back{display:none!important}
 main{display:block;padding:0}
 .sop{border:0;padding:0}
 body{background:#fff}
}
.wm{position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.2;background-repeat:repeat}
body{-webkit-user-select:none;user-select:none}input{-webkit-user-select:text;user-select:text}
@media print{body>*{display:none!important}}
</style>
</head>

const showChg = () => isAud() && $('#chg').checked;
const visible = () => DATA.sops.filter(s => s.acl.includes(ROLE));
const CHI={"GV": "<path d=\"M12 3v18M5 21h14M4 7h16M12 3l-1 4h2z\"/><path d=\"M6 7l-3 7a3 3 0 0 0 6 0zM18 7l-3 7a3 3 0 0 0 6 0z\"/>", "HR": "<circle cx=\"9\" cy=\"8\" r=\"3.2\"/><path d=\"M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6\"/><circle cx=\"17\" cy=\"9\" r=\"2.5\"/><path d=\"M16 14.2c2.8.2 5 2.6 5 5.8\"/>", "ST": "<path d=\"M3 9l1.5-5h15L21 9\"/><path d=\"M3 9h18v2a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0z\"/><path d=\"M5 13v8h14v-8M10 21v-5h4v5\"/>", "INV": "<path d=\"M3 8l9-5 9 5-9 5z\"/><path d=\"M3 8v8l9 5 9-5V8M12 13v8\"/><path d=\"M7.5 5.5l9 5\"/>", "SL": "<path d=\"M3 4h2l2.4 11h11l2-8H6.2\"/><circle cx=\"9.5\" cy=\"19.5\" r=\"1.5\"/><circle cx=\"17\" cy=\"19.5\" r=\"1.5\"/><path d=\"M11 10.5l2 2 3.5-3.5\"/>", "DM": "<path d=\"M3 8l9-5 9 5v8l-9 5-9-5z\"/><path d=\"M12 8v5M12 16.2v.3\"/>", "FN": "<rect x=\"2.5\" y=\"6\" width=\"19\" height=\"12\" rx=\"2\"/><circle cx=\"12\" cy=\"12\" r=\"2.8\"/><path d=\"M6 9.5v5M18 9.5v5\"/>", "LP": "<path d=\"M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z\"/><rect x=\"9\" y=\"11\" width=\"6\" height=\"5\" rx=\"1\"/><path d=\"M10 11V9.5a2 2 0 0 1 4 0V11\"/>"};
const chIcon=(k,sz=20)=>CHI[k]?`<svg class="chi" width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none" stroke="#283583" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${CHI[k]}</svg>`:'';
const chOf = s => DATA.chapters.find(c => c.name === s.chapter).key;
const text = s => [s.code, s.title, ...s.purpose, ...s.scope, ...s.policies.map(p => p.t), ...s.steps.flatMap(g => g.rows.map(r => r.role + ' ' + r.text)), ...(s.tables||[]).flatMap(t => t.rows.flat())].join(' ');

function init(){
  tab = DATA.chapters[0].key;
  const v = DATA.version;
  $('#ver').textContent = `الإصدار ${v.no} · ${v.status} · ${v.date}`;
  const sel = $('#role');
  Object.entries(DATA.roles).forEach(([k, n]) => sel.insertAdjacentHTML('beforeend', `<option value="${k}">عرض: ${n}</option>`));
  sel.value = ROLE;
  if (LOCKED) sel.style.display = 'none';
  sel.onchange = () => { ROLE = sel.value; cur = null; render(); };
  $('#chg').onchange = render;
  $('#q').oninput = e => { q = e.target.value.trim(); render(); };
  window.addEventListener('hashchange', fromHash);
  fromHash(true);
}
function fromHash(first){
  const h = decodeURIComponent(location.hash.slice(1));
  if (h === 'audit' && isAud()) { tab = 'audit'; cur = null; }
  else { const s = visible().find(x => x.code === h); if (s) { tab = chOf(s); cur = s.code; document.body.classList.add('detail'); } }
  render();
}
function go(code){ cur = code; try{ history.replaceState(null,'','#'+code);}catch(e){ location.hash = code; } document.body.classList.add('detail'); render(); window.scrollTo(0,0); }

function render(){
  $('#chgWrap').style.display = isAud() ? '' : 'none';
  const vis = visible();
  const tabs = $('#tabs'); tabs.innerHTML = '';
  if (q) {
    tabs.innerHTML = `<button class="on">نتائج البحث</button>`;
  } else {
    DATA.chapters.forEach(c => {
      const n = vis.filter(s => s.chapter === c.name).length; if (!n) return;
      tabs.insertAdjacentHTML('beforeend', `<button data-k="${c.key}" class="${tab===c.key?'on':''}">${chIcon(c.key)}${esc(c.name)}<span class="n">${n}</span></button>`);
    });
    if (isAud()) tabs.insertAdjacentHTML('beforeend', `<button data-k="audit" class="aud ${tab==='audit'?'on':''}">تقرير التدقيق والفجوات</button>`);
    const on = tabs.querySelector('.on'); if (on) on.scrollIntoView({inline:'center',block:'nearest'});
    tabs.querySelectorAll('button').forEach(b => b.onclick = () => { tab = b.dataset.k; cur = null; document.body.classList.remove('detail'); try{history.replaceState(null,'',tab==='audit'?'#audit':location.pathname);}catch(e){} render(); });
  }
  const main = $('#main');
  if (!q && tab === 'audit' && isAud()) { main.innerHTML = auditHTML(); document.body.classList.add('detail'); return; }
  if (!q && !vis.some(s => chOf(s) === tab)) tab = chOf(vis[0]);
  let list = q ? vis.filter(s => text(s).includes(q)) : vis.filter(s => chOf(s) === tab);
  if (!list.length) { main.innerHTML = `<div class="empty" style="grid-column:1/-1">لا توجد نتائج</div>`; return; }
  if (!cur || !list.some(s => s.code === cur)) cur = list[0].code;
  const s = list.find(x => x.code === cur);
  main.innerHTML = `<aside><div class="list">${list.map(x => `<button class="item ${x.code===cur?'on':''}" data-c="${x.code}"><span class="c">${x.code}</span>${showChg()?`<span class="badge ${x.status==='new'?'b-new':'b-mod'}">${x.status==='new'?'جديد':'مُدقَّق'}</span>`:''}<div class="t">${esc(x.title)}</div></button>`).join('')}</div></aside>
  <section class="sop">${sopHTML(s)}</section>`;
  main.querySelectorAll('.item').forEach(b => b.onclick = () => go(b.dataset.c));
  const bk = main.querySelector('.back'); if (bk) bk.onclick = () => { document.body.classList.remove('detail'); window.scrollTo(0,0); };
}
const tg = t => (showChg() && t) ? `<span class="tag ${t==='new'?'t-new':'t-mod'}">${t==='new'?'جديد':'معدّل'}</span>` : '';

function sopHTML(s){
  let h = `<button class="back">→ قائمة الإجراءات</button>`;
  h += `<div class="code">${s.code}</div>${showChg()?`<span class="badge ${s.status==='new'?'b-new':'b-mod'}">${s.status==='new'?'إجراء جديد':'إجراء مُدقَّق ومعدّل'}</span>`:''}`;
  h += `<h2>${esc(s.title)}</h2><div class="muted chl" style="font-size:13px">${chIcon(chOf(s),18)}${esc(s.chapter)}</div>`;
  const r = s.raci;
  h += `<div class="raci"><div><b>المسؤول عن التنفيذ</b>${esc(r.R)}</div><div><b>المحاسَب</b>${esc(r.A)}</div><div><b>يُستشار</b>${esc(r.C)}</div><div><b>يُبلَّغ</b>${esc(r.I)}</div></div>`;
  if (s.purpose.length) h += `<h3>الغرض</h3>${s.purpose.map(p => `<p style="margin:4px 0">${esc(p)}</p>`).join('')}`;
  if (s.scope.length) h += `<h3>نطاق العمل</h3>${s.scope.map(p => `<p style="margin:4px 0">${esc(p)}</p>`).join('')}`;
  if (s.policies.length) h += `<h3>السياسات والضوابط</h3><ol class="pol">${s.policies.map(p => `<li>${esc(p.t)}${tg(p.tag)}</li>`).join('')}</ol>`;
  (s.tables||[]).forEach(t => { h += `<h3>${esc(t.title)}</h3><div class="tw"><table><tr>${t.head.map(x => `<th>${esc(x)}</th>`).join('')}</tr>${t.rows.map(rw => `<tr>${rw.map(x => `<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table></div>`; });
  if (s.steps.length) {
    h += `<h3>خطوات التنفيذ</h3>`;
    s.steps.forEach(g => {
      if (g.title && s.steps.length > 1) h += `<div class="grp">${esc(g.title)}</div>`;
      h += `<div class="tw"><table><tr><th>#</th><th>المسؤول</th><th>الخطوة</th><th class="form">النموذج</th></tr>${g.rows.map(x => `<tr><td class="num">${x.n}</td><td class="role">${esc(x.role)}</td><td>${esc(x.text)}${tg(x.tag)}</td><td class="form">${esc(x.form)}</td></tr>`).join('')}</table></div>`;
    });
    h += `<h3>ملخص المسؤوليات</h3><div class="tw"><table><tr><th>الدور</th><th>الخطوات</th></tr>${s.roles.map(x => `<tr><td class="role">${esc(x.role)}</td><td>${x.steps.join('، ')}</td></tr>`).join('')}</table></div>`;
  }
  if (s.kpis.length) h += `<h3>مؤشرات الأداء</h3><ul class="k">${s.kpis.map(k => `<li>${esc(k)}</li>`).join('')}</ul>`;
  if (s.forms.length || s.systems.length) {
    h += `<h3>النماذج والأنظمة</h3><div class="kv">${s.forms.map(f => `<span>📄 ${esc(f)}</span>`).join('')}${s.systems.map(f => `<span>🖥 ${esc(f)}</span>`).join('')}</div>`;
  }
  if (showChg() && (s.changes.length || s.gaps.length)) {
    h += `<div class="notes"><h3>${s.status==='new'?'سبب الإضافة':'ملاحظات التدقيق وما تم تصحيحه'}</h3><ul>${s.changes.map(c => `<li>${esc(c)}</li>`).join('')}${s.gaps.map(c => `<li><b>فجوة متبقية:</b> ${esc(c)}</li>`).join('')}</ul>${s.status==='mod'?'<div class="muted" style="font-size:12.5px">إضافة لما سبق: تصحيح الأخطاء الإملائية وتوحيد المسميات الوظيفية في كامل الإجراء.</div>':''}</div>`;
  }
  h += `<div class="muted" style="font-size:12px;margin-top:16px">ظاهر لـ: ${s.acl.map(a => DATA.roles[a]).join('، ')}</div>`;
  return h;
}

function auditHTML(){
  const a = DATA.audit, S = DATA.sops;
  const mod = S.filter(s => s.status==='mod').length, nw = S.filter(s => s.status==='new').length;
  const ch = S.reduce((n, s) => n + (s.status==='mod' ? s.changes.length : 0), 0);
  let h = `<section class="audit"><h2>تقرير التدقيق والفجوات</h2>
  <div class="stats"><div class="stat"><b>${mod}</b><span>إجراء قائم تم تدقيقه</span></div><div class="stat"><b>${ch}</b><span>تعديل موثق</span></div><div class="stat"><b>${nw}</b><span>إجراء جديد لسد الفجوات</span></div><div class="stat"><b>${a.critical.length}</b><span>ملاحظة نظامية حرجة</span></div></div>`;
  h += `<h3>الخلاصة</h3>${a.summary.map(p => `<p>${esc(p)}</p>`).join('')}`;
  h += `<h3><span class="sev">ملاحظات نظامية حرجة</span> (تمت معالجتها في هذا الإصدار)</h3><div class="tw"><table><tr><th>الملاحظة</th><th>الإجراء</th><th>الخطر</th><th>المعالجة</th></tr>${a.critical.map(r => `<tr><td><b>${esc(r[0])}</b></td><td><a href="#${r[1]}" class="code">${r[1]}</a></td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join('')}</table></div>`;
  h += `<h3>ملاحظات هيكلية</h3><ul class="k">${a.structural.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  const conf = S.flatMap(s => s.changes.filter(c => c.startsWith('تعارض')).map(c => [s.code, s.title, c]));
  h += `<h3>التعارضات الداخلية المصححة (${conf.length})</h3><div class="tw"><table><tr><th>الإجراء</th><th>التعارض والحل</th></tr>${conf.map(r => `<tr><td style="width:200px"><a href="#${r[0]}" class="code">${r[0]}</a><div>${esc(r[1])}</div></td><td>${esc(r[2])}</td></tr>`).join('')}</table></div>`;
  h += `<h3>الإجراءات الجديدة (${nw})</h3><div class="tw"><table><tr><th>الإجراء</th><th>الباب</th><th>الفجوة التي يسدها</th></tr>${S.filter(s => s.status==='new').map(s => `<tr><td style="width:240px"><a href="#${s.code}" class="code">${s.code}</a><div><b>${esc(s.title)}</b></div></td><td style="width:160px">${esc(s.chapter)}</td><td>${esc((s.changes[0]||'').replace(/^فجوة( جوهرية)?:\s*/,''))}</td></tr>`).join('')}</table></div>`;
  h += `<h3>القرارات على القيم المقترحة</h3><div class="tw"><table><tr><th>البند</th><th>الإجراء</th><th>صاحب الاعتماد</th><th>الحالة</th></tr>${a.decisions.map(r => `<tr><td>${esc(r[0])}</td><td class="code">${esc(r[1])}</td><td>${esc(r[2])}</td><td><b style="color:${r[3].startsWith('معتمد')?'var(--new)':r[3].startsWith('ملغى')?'var(--red)':'var(--mod)'}">${esc(r[3])}</b></td></tr>`).join('')}</table></div>`;
  const v = DATA.version;
  h += `<h3>جدول الاعتماد</h3><div class="tw"><table><tr><th>العلاقة</th><th>الاسم</th><th>الوظيفة</th><th>التاريخ</th><th>التوقيع</th></tr>${v.sign.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td></td><td></td></tr>`).join('')}</table></div>
  <div class="tw" style="margin-top:10px"><table><tr><th>الإدارة</th><th>الاسم</th><th>الوظيفة</th><th>التاريخ</th><th>التوقيع</th></tr>${v.depts.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td></td><td></td></tr>`).join('')}</table></div>`;
  h += `<p class="portal-note" style="margin-top:16px">هذا التبويب يظهر للجنة التنفيذية ومدير التجزئة فقط. باقي المستخدمين يرون الإجراءات المعتمدة لدورهم دون ملاحظات التدقيق.</p></section>`;
  return h;
}
document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('copy',e=>{if(!(e.target.closest&&e.target.closest('input')))e.preventDefault()});
(async()=>{
  const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const deny=m=>{document.getElementById('main').innerHTML=`<div class="empty" style="grid-column:1/-1">${m}<br><br><a href="index.html">العودة إلى بوابة تمكين للتجزئة</a></div>`;};
  let s=null;try{s=JSON.parse(sessionStorage.getItem('tmk_s')||'null')}catch(e){}
  if(!s){deny('يرجى تسجيل الدخول من البوابة أولًا ثم فتح دليل التشغيل.');return;}
  const e=(s.b||[]).find(x=>x[0]==='sop');
  if(!e){deny('دليل التشغيل غير متاح لحسابك.');return;}
  try{
    const r=await fetch('d/'+e[1]+'.bin',{cache:'no-store'});const buf=new Uint8Array(await r.arrayBuffer());
    const key=await crypto.subtle.importKey('raw',b64(e[2]),'AES-GCM',false,['decrypt']);
    DATA=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12))));
  }catch(err){deny('تعذّر تحميل الدليل. حدّث الصفحة وحاول مرة أخرى.');return;}
  ROLE=DATA.role;init();
  try{const t=(s.u||'')+' — '+(s.fn||s.n||'')+' — '+new Date().toLocaleDateString('en-GB');const w=document.createElement('div');w.className='wm';
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="230" height="130"><text x="115" y="70" text-anchor="middle" transform="rotate(-24 115 70)" font-family="Tahoma,sans-serif" font-size="14" font-weight="700" fill="#5A648C">${t.replace(/[<>&"]/g,'')}</text></svg>`;
    w.style.backgroundImage=`url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}")`;document.body.appendChild(w);}catch(_){}
})();
</script>
